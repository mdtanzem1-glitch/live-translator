 - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - uses: android-actions/setup-android@v3

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.7

  - name: Generate Android project
    run: |
      mkdir -p app/src/main/java/com/example/livetranslator
      cp MainActivity.kt app/src/main/java/com/example/livetranslator/MainActivity.kt

      cat > settings.gradle.kts <<'EOF'
      pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
      }
      dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
      }
      rootProject.name = "LiveTranslator"
      include(":app")
      EOF

      cat > build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
      }
      EOF

      cat > gradle.properties <<'EOF'
      android.useAndroidX=true
      org.gradle.jvmargs=-Xmx3g
      EOF

      cat > app/build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
      }
      android {
          namespace = "com.example.livetranslator"
          compileSdk = 34
          defaultConfig {
              applicationId = "com.example.livetranslator"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
          }
          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
      }
      dependencies {
          implementation("com.google.mlkit:translate:17.0.3")
          implementation("androidx.appcompat:appcompat:1.7.0")
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <uses-permission android:name="android.permission.RECORD_AUDIO"/>
      <uses-permission android:name="android.permission.INTERNET"/>
      <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
      <application android:label="Live Translator" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
      <activity android:name=".MainActivity" android:exported="true">
      <intent-filter>
      <action android:name="android.intent.action.MAIN"/>
      <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
      </activity>
      </application>
      </manifest>
      EOF

  - name: Build debug APK
    run: gradle assembleDebug --no-daemon

  - name: Upload APK as release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: v${{ github.run_number }}
      name: Live Translator v${{ github.run_number }}
      files: app/build/outputs/apk/debug/app-debug.apk
